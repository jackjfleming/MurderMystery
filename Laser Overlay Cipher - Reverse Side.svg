<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="5.0in" height="7.0in" version="1.1">
  <title>The Starlight Archives - Celestial Astrolabe Planisphere (Reverse Side)</title>
  <desc>Reverse Side Engraving: 19th-Century Astronomical Star Chart &amp; Transit Graticule</desc>

  <defs>
    <!-- Star Marker Symbol Definition -->
    <g id="star-first-mag">
      <circle cx="0" cy="0" r="3.5" fill="#000000" />
      <circle cx="0" cy="0" r="5.5" fill="none" stroke="#000000" stroke-width="0.75" />
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#000000" stroke-width="0.5" />
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#000000" stroke-width="0.5" />
    </g>
    <g id="star-second-mag">
      <circle cx="0" cy="0" r="2.5" fill="#000000" />
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#000000" stroke-width="0.5" />
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#000000" stroke-width="0.5" />
    </g>
    <g id="star-third-mag">
      <circle cx="0" cy="0" r="1.8" fill="#000000" />
    </g>
  </defs>

  <!-- ========================================================================= -->
  <!-- LAYER 1: ENGRAVING (BLACK #000000) - Astronomical Planisphere & Graticule -->
  <!-- ========================================================================= -->
  <g id="ENGRAVING_LAYER" stroke="#000000" fill="none" stroke-width="1.0">
    
    <!-- Outer Ornamental Frame -->
    <rect x="15" y="15" width="470" height="670" rx="10" ry="10" stroke-width="2.5" />
    <rect x="23" y="23" width="454" height="654" rx="7" ry="7" stroke-width="0.75" stroke-dasharray="3,3" />
    <rect x="27" y="27" width="446" height="646" rx="5" ry="5" stroke-width="1.2" />

    <!-- Corner Astronomical Emblems -->
    <!-- Top-Left: Radiant Sun / Sol -->
    <g transform="translate(48, 48)">
      <circle cx="0" cy="0" r="10" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#000000" />
      <path d="M 0,-16 L 0,-12 M 0,12 L 0,16 M -16,0 L -12,0 M 12,0 L 16,0" stroke-width="1.2" />
      <path d="M -11,-11 L -8,-8 M 8,8 L 11,11 M -11,11 L -8,8 M 8,-8 L 11,-11" stroke-width="1.0" />
      <text x="0" y="23" font-family="Georgia, serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#000000" stroke="none">SOL</text>
    </g>

    <!-- Top-Right: Crescent Moon / Luna -->
    <g transform="translate(452, 48)">
      <path d="M -4,-12 A 12,12 0 1,0 12,4 A 10,10 0 1,1 -4,-12 Z" fill="#000000" stroke="none" />
      <circle cx="4" cy="-8" r="1.5" fill="#000000" stroke="none" />
      <circle cx="8" cy="-3" r="1.0" fill="#000000" stroke="none" />
      <text x="0" y="23" font-family="Georgia, serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#000000" stroke="none">LUNA</text>
    </g>

    <!-- Bottom-Left: Armillary Sphere / Quadrant Motif -->
    <g transform="translate(48, 652)">
      <circle cx="0" cy="0" r="11" stroke-width="1.2" />
      <ellipse cx="0" cy="0" rx="11" ry="4" stroke-width="0.8" />
      <line x1="-11" y1="0" x2="11" y2="0" stroke-width="0.8" />
      <line x1="0" y1="-11" x2="0" y2="11" stroke-width="0.8" />
      <text x="0" y="-15" font-family="Georgia, serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#000000" stroke="none">SPHAERA</text>
    </g>

    <!-- Bottom-Right: Astrolabe Compass Rose -->
    <g transform="translate(452, 652)">
      <circle cx="0" cy="0" r="11" stroke-width="1.2" />
      <polygon points="0,-11 3,-3 11,0 3,3 0,11 -3,3 -11,0 -3,-3" fill="#000000" />
      <text x="0" y="-15" font-family="Georgia, serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#000000" stroke="none">POLUS</text>
    </g>

    <!-- Header Typography -->
    <text x="250" y="55" font-family="Georgia, serif" font-size="13" font-weight="bold" letter-spacing="3" text-anchor="middle" fill="#000000" stroke="none">THE STARLIGHT OBSERVATORY</text>
    <text x="250" y="72" font-family="Georgia, serif" font-size="8" letter-spacing="2.5" text-anchor="middle" fill="#000000" stroke="none">NORTHERN CELESTIAL PLANISPHERE • EPOCH 1847.5</text>
    <text x="250" y="86" font-family="Georgia, serif" font-style="italic" font-size="7" letter-spacing="1.5" text-anchor="middle" fill="#000000" stroke="none">Canon Stellarum &amp; Apparent Transit Graticule</text>
    <line x1="80" y1="94" x2="420" y2="94" stroke-width="0.75" />

    <!-- ========================================================================= -->
    <!-- CENTRAL ASTROLABE PLANISPHERE PROJECTION (Center at x=250, y=345)         -->
    <!-- ========================================================================= -->
    
    <!-- Outer Degree Coordinate Ring -->
    <circle cx="250" cy="345" r="235" stroke-width="1.8" />
    <circle cx="250" cy="345" r="227" stroke-width="0.75" />
    <circle cx="250" cy="345" r="221" stroke-width="1.0" stroke-dasharray="2,4" />

    <!-- Declination Rings (Concentric Circles) -->
    <circle cx="250" cy="345" r="175" stroke-width="0.75" stroke-dasharray="4,3" />
    <circle cx="250" cy="345" r="130" stroke-width="0.8" />
    <circle cx="250" cy="345" r="85" stroke-width="0.75" stroke-dasharray="4,3" />
    <circle cx="250" cy="345" r="40" stroke-width="0.8" />

    <!-- Declination Degree Labels -->
    <text x="250" y="302" font-family="Georgia, serif" font-size="6" text-anchor="middle" fill="#000000" stroke="none">+80°</text>
    <text x="250" y="257" font-family="Georgia, serif" font-size="6" text-anchor="middle" fill="#000000" stroke="none">+60°</text>
    <text x="250" y="212" font-family="Georgia, serif" font-size="6" text-anchor="middle" fill="#000000" stroke="none">+40°</text>
    <text x="250" y="167" font-family="Georgia, serif" font-size="6" text-anchor="middle" fill="#000000" stroke="none">+20°</text>
    <text x="250" y="122" font-family="Georgia, serif" font-size="6" text-anchor="middle" fill="#000000" stroke="none">EQUATOR 0°</text>

    <!-- Radial Hour Lines (Right Ascension / Meridian Lines) -->
    <g stroke-width="0.5" stroke="#000000">
      <!-- 0h / 12h (Vertical Meridian) -->
      <line x1="250" y1="110" x2="250" y2="580" stroke-dasharray="6,3" stroke-width="0.75" />
      <!-- 6h / 18h (Horizontal Colure) -->
      <line x1="15" y1="345" x2="485" y2="345" stroke-dasharray="6,3" stroke-width="0.75" />
      <!-- 30° diagonals -->
      <line x1="105" y1="94" x2="395" y2="596" stroke-dasharray="2,4" />
      <line x1="395" y1="94" x2="105" y2="596" stroke-dasharray="2,4" />
      <!-- 60° diagonals -->
      <line x1="46" y1="227" x2="454" y2="463" stroke-dasharray="2,4" />
      <line x1="46" y1="463" x2="454" y2="227" stroke-dasharray="2,4" />
    </g>

    <!-- Cardinal Hour Indices around Ring -->
    <text x="250" y="106" font-family="Georgia, serif" font-weight="bold" font-size="7" text-anchor="middle" fill="#000000" stroke="none">XXIV h • NORTH</text>
    <text x="250" y="591" font-family="Georgia, serif" font-weight="bold" font-size="7" text-anchor="middle" fill="#000000" stroke="none">XII h • SOUTH</text>
    <text x="20" y="348" font-family="Georgia, serif" font-weight="bold" font-size="7" text-anchor="start" fill="#000000" stroke="none">VI h</text>
    <text x="480" y="348" font-family="Georgia, serif" font-weight="bold" font-size="7" text-anchor="end" fill="#000000" stroke="none">XVIII h</text>

    <!-- Zodiac Constellation Glyphs around Outer Circle -->
    <g font-family="Georgia, serif" font-size="7" fill="#000000" stroke="none">
      <text x="310" y="118">♈ ARIES</text>
      <text x="390" y="165">♉ TAURUS</text>
      <text x="445" y="240">♊ GEMINI</text>
      <text x="440" y="440">♌ LEO</text>
      <text x="395" y="525">♍ VIRGO</text>
      <text x="310" y="575">♎ LIBRA</text>
      <text x="145" y="575">♏ SCORPIO</text>
      <text x="65" y="525">♐ SAGITTARIUS</text>
      <text x="35" y="440">♑ CAPRICORN</text>
      <text x="40" y="240">♒ AQUARIUS</text>
      <text x="90" y="165">♓ PISCES</text>
    </g>

    <!-- ========================================================================= -->
    <!-- CONSTELLATION CHARTS & STAR NODES                                         -->
    <!-- ========================================================================= -->

    <!-- Constellation Lines -->
    <g stroke="#000000" stroke-width="0.8" stroke-linecap="round">
      <!-- Ursa Major (Big Dipper) in Top Left / Center -->
      <polyline points="120,175 145,185 170,180 195,198 185,225 220,230 228,202 195,198" fill="none" />
      
      <!-- Cassiopeia (The 'W') in Top Right -->
      <polyline points="330,150 350,170 375,155 400,175 420,160" fill="none" />

      <!-- Cygnus (Northern Cross) -->
      <line x1="285" y1="180" x2="325" y2="235" />
      <line x1="275" y1="205" x2="335" y2="210" />

      <!-- Lyra with Vega -->
      <polygon points="265,160 280,150 290,165 275,175" fill="none" stroke-width="0.6" stroke-dasharray="2,2" />

      <!-- Orion (Hunter & Belt) Bottom Right -->
      <line x1="365" y1="410" x2="415" y2="400" />
      <line x1="365" y1="410" x2="375" y2="470" />
      <line x1="415" y1="400" x2="425" y2="460" />
      <line x1="375" y1="470" x2="425" y2="460" />
      <!-- Orion's Belt -->
      <line x1="385" y1="435" x2="405" y2="433" stroke-width="1.2" />

      <!-- Pegasus Great Square Bottom Left -->
      <polygon points="80,410 125,400 135,450 90,460" fill="none" stroke-dasharray="3,2" />
    </g>

    <!-- Star Nodes (Magnitude Placements) -->
    <!-- North Star (Polaris) near Central Hub -->
    <use href="#star-first-mag" x="250" y="335" />
    <text x="250" y="325" font-family="Georgia, serif" font-size="6.5" font-weight="bold" letter-spacing="1" text-anchor="middle" fill="#000000" stroke="none">POLARIS (α UMi)</text>

    <!-- Ursa Major Stars -->
    <use href="#star-second-mag" x="120" y="175" />
    <use href="#star-third-mag" x="145" y="185" />
    <use href="#star-second-mag" x="170" y="180" />
    <use href="#star-second-mag" x="195" y="198" />
    <use href="#star-second-mag" x="185" y="225" />
    <use href="#star-first-mag" x="220" y="230" />
    <use href="#star-second-mag" x="228" y="202" />
    <text x="160" y="165" font-family="Georgia, serif" font-style="italic" font-size="6.5" fill="#000000" stroke="none">URSA MAJOR</text>

    <!-- Cassiopeia Stars -->
    <use href="#star-second-mag" x="330" y="150" />
    <use href="#star-first-mag" x="350" y="170" />
    <use href="#star-second-mag" x="375" y="155" />
    <use href="#star-second-mag" x="400" y="175" />
    <use href="#star-third-mag" x="420" y="160" />
    <text x="375" y="142" font-family="Georgia, serif" font-style="italic" font-size="6.5" text-anchor="middle" fill="#000000" stroke="none">CASSIOPEIA</text>

    <!-- Vega / Lyra -->
    <use href="#star-first-mag" x="265" y="160" />
    <use href="#star-third-mag" x="280" y="150" />
    <use href="#star-third-mag" x="290" y="165" />
    <use href="#star-third-mag" x="275" y="175" />
    <text x="265" y="148" font-family="Georgia, serif" font-size="6" text-anchor="middle" fill="#000000" stroke="none">VEGA (α Lyr)</text>

    <!-- Cygnus (Deneb) -->
    <use href="#star-first-mag" x="325" y="235" />
    <use href="#star-second-mag" x="285" y="180" />
    <text x="340" y="245" font-family="Georgia, serif" font-size="6" fill="#000000" stroke="none">DENEB</text>

    <!-- Orion Stars (Betelgeuse, Rigel, Belt) -->
    <use href="#star-first-mag" x="365" y="410" />
    <text x="345" y="405" font-family="Georgia, serif" font-size="6" fill="#000000" stroke="none">BETELGEUSE</text>
    <use href="#star-first-mag" x="425" y="460" />
    <text x="435" y="468" font-family="Georgia, serif" font-size="6" fill="#000000" stroke="none">RIGEL</text>
    <use href="#star-second-mag" x="415" y="400" />
    <use href="#star-second-mag" x="375" y="470" />
    <use href="#star-third-mag" x="385" y="435" />
    <use href="#star-third-mag" x="395" y="434" />
    <use href="#star-third-mag" x="405" y="433" />
    <text x="400" y="485" font-family="Georgia, serif" font-style="italic" font-size="6.5" text-anchor="middle" fill="#000000" stroke="none">ORION</text>

    <!-- Taurus & Pleiades Cluster -->
    <use href="#star-first-mag" x="430" y="315" />
    <text x="435" y="305" font-family="Georgia, serif" font-size="6" fill="#000000" stroke="none">ALDEBARAN</text>
    <!-- Pleiades tiny cluster dots -->
    <circle cx="455" cy="275" r="1.2" fill="#000000" />
    <circle cx="458" cy="272" r="1.0" fill="#000000" />
    <circle cx="462" cy="274" r="1.2" fill="#000000" />
    <circle cx="459" cy="278" r="1.0" fill="#000000" />
    <circle cx="464" cy="279" r="1.0" fill="#000000" />
    <circle cx="453" cy="279" r="0.8" fill="#000000" />
    <text x="460" y="267" font-family="Georgia, serif" font-size="5.5" font-style="italic" text-anchor="middle" fill="#000000" stroke="none">PLEIADES</text>

    <!-- ========================================================================= -->
    <!-- REVERSE APERTURE FRAMES & ASTRONOMICAL TRANSIT LABELS                      -->
    <!-- These frame the 4 cutouts naturally as telescope / meridian reading slits -->
    <!-- Mirrored Coordinates:                                                     -->
    <!-- Hole 1: x=100, y=248, w=165, h=38                                         -->
    <!-- Hole 2: x=235, y=340, w=85,  h=38                                         -->
    <!-- Hole 3: x=135, y=390, w=75,  h=38                                         -->
    <!-- Hole 4: x=175, y=440, w=150, h=38                                         -->
    <!-- ========================================================================= -->

    <!-- Aperture 1 Frame: URSA MAJOR TRANSIT GAUGE -->
    <rect x="96" y="244" width="173" height="46" rx="6" ry="6" stroke-width="0.8" stroke-dasharray="4,2" />
    <text x="182" y="241" font-family="Georgia, serif" font-size="6" letter-spacing="1" text-anchor="middle" fill="#000000" stroke="none">✦ MERIDIAN TRANSIT APERTURE I • SECTOR α ✦</text>
    <text x="182" y="297" font-family="Courier New, monospace" font-size="5" text-anchor="middle" fill="#000000" stroke="none">INDEX SCALE: 14h 22m | DECL. +55° 18′</text>

    <!-- Aperture 2 Frame: POLARIS MERIDIAN GAUGE -->
    <rect x="231" y="336" width="93" height="46" rx="6" ry="6" stroke-width="0.8" stroke-dasharray="4,2" />
    <text x="277" y="333" font-family="Georgia, serif" font-size="5.5" letter-spacing="0.5" text-anchor="middle" fill="#000000" stroke="none">✦ POLAR DIAL II ✦</text>
    <text x="277" y="389" font-family="Courier New, monospace" font-size="5" text-anchor="middle" fill="#000000" stroke="none">COLURE 0° | +89° N</text>

    <!-- Aperture 3 Frame: EQUATORIAL TRANSIT GAUGE -->
    <rect x="131" y="386" width="83" height="46" rx="6" ry="6" stroke-width="0.8" stroke-dasharray="4,2" />
    <text x="172" y="383" font-family="Georgia, serif" font-size="5.5" letter-spacing="0.5" text-anchor="middle" fill="#000000" stroke="none">✦ APERTURE III ✦</text>
    <text x="172" y="439" font-family="Courier New, monospace" font-size="5" text-anchor="middle" fill="#000000" stroke="none">FIELD GAUGE γ</text>

    <!-- Aperture 4 Frame: ECLIPTIC ARC GAUGE -->
    <rect x="171" y="436" width="158" height="46" rx="6" ry="6" stroke-width="0.8" stroke-dasharray="4,2" />
    <text x="250" y="433" font-family="Georgia, serif" font-size="6" letter-spacing="1" text-anchor="middle" fill="#000000" stroke="none">✦ ECLIPTIC TRANSIT APERTURE IV • SECTOR δ ✦</text>
    <text x="250" y="489" font-family="Courier New, monospace" font-size="5" text-anchor="middle" fill="#000000" stroke="none">EQUINOCTIAL CALIBRATION • RATIO 1:1847</text>

    <!-- Vernier Calibration Tick Marks along Border sides -->
    <g stroke="#000000" stroke-width="0.75">
      <!-- Left side vernier ticks -->
      <line x1="27" y1="200" x2="35" y2="200" /><line x1="27" y1="210" x2="32" y2="210" /><line x1="27" y1="220" x2="35" y2="220" />
      <line x1="27" y1="230" x2="32" y2="230" /><line x1="27" y1="240" x2="35" y2="240" /><line x1="27" y1="250" x2="32" y2="250" />
      <line x1="27" y1="260" x2="37" y2="260" /><line x1="27" y1="270" x2="32" y2="270" /><line x1="27" y1="280" x2="35" y2="280" />
      <line x1="27" y1="290" x2="32" y2="290" /><line x1="27" y1="300" x2="35" y2="300" /><line x1="27" y1="310" x2="32" y2="310" />
      <line x1="27" y1="320" x2="37" y2="320" /><line x1="27" y1="330" x2="32" y2="330" /><line x1="27" y1="340" x2="35" y2="340" />

      <!-- Right side vernier ticks -->
      <line x1="473" y1="200" x2="465" y2="200" /><line x1="473" y1="210" x2="468" y2="210" /><line x1="473" y1="220" x2="465" y2="220" />
      <line x1="473" y1="230" x2="468" y2="230" /><line x1="473" y1="240" x2="465" y2="240" /><line x1="473" y1="250" x2="468" y2="250" />
      <line x1="473" y1="260" x2="463" y2="260" /><line x1="473" y1="270" x2="468" y2="270" /><line x1="473" y1="280" x2="465" y2="280" />
      <line x1="473" y1="290" x2="468" y2="290" /><line x1="473" y1="300" x2="465" y2="300" /><line x1="473" y1="310" x2="468" y2="310" />
      <line x1="473" y1="320" x2="463" y2="320" /><line x1="473" y1="330" x2="468" y2="330" /><line x1="473" y1="340" x2="465" y2="340" />
    </g>

    <!-- ========================================================================= -->
    <!-- FOOTER: STELLAR MAGNITUDE KEY & OBSERVATORY CALIBRATION SPECIFICATIONS    -->
    <!-- ========================================================================= -->
    <line x1="80" y1="600" x2="420" y2="600" stroke-width="0.75" />

    <!-- Magnitude Legend -->
    <g transform="translate(110, 615)">
      <use href="#star-first-mag" x="0" y="0" />
      <text x="10" y="3" font-family="Georgia, serif" font-size="6" fill="#000000" stroke="none">1st Mag.</text>

      <use href="#star-second-mag" x="75" y="0" />
      <text x="85" y="3" font-family="Georgia, serif" font-size="6" fill="#000000" stroke="none">2nd Mag.</text>

      <use href="#star-third-mag" x="150" y="0" />
      <text x="158" y="3" font-family="Georgia, serif" font-size="6" fill="#000000" stroke="none">3rd Mag.</text>

      <circle cx="215" cy="0" r="1.0" fill="#000000" />
      <text x="222" y="3" font-family="Georgia, serif" font-size="6" fill="#000000" stroke="none">4th / Nebular</text>
    </g>

    <!-- Geographic & Instrument Metadata -->
    <text x="250" y="633" font-family="Georgia, serif" font-size="7" letter-spacing="1" text-anchor="middle" fill="#000000" stroke="none">OBSERVATORY LATITUDE 42° 21′ 30″ N • MERIDIAN LONGITUDE 71° 03′ 45″ W</text>
    <text x="250" y="646" font-family="Georgia, serif" font-style="italic" font-size="6.5" letter-spacing="0.75" text-anchor="middle" fill="#000000" stroke="none">Calculated for the Great Equatorial Refractor • Folio Instrument No. 47</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LAYER 2: CUTOUT REFERENCE GUIDE (RED #FF0000)                             -->
  <!-- Mirrored Cutout Alignment for Double-Sided Registration                   -->
  <!-- ========================================================================= -->
  <g id="MIRRORED_CUT_REGISTRATION" stroke="#FF0000" fill="none" stroke-width="0.75" opacity="0.6">
    <!-- Mirrored Slot 1 -->
    <rect x="100" y="248" width="165" height="38" rx="4" ry="4" stroke-dasharray="2,2" />
    <!-- Mirrored Slot 2 -->
    <rect x="235" y="340" width="85" height="38" rx="4" ry="4" stroke-dasharray="2,2" />
    <!-- Mirrored Slot 3 -->
    <rect x="135" y="390" width="75" height="38" rx="4" ry="4" stroke-dasharray="2,2" />
    <!-- Mirrored Slot 4 -->
    <rect x="175" y="440" width="150" height="38" rx="4" ry="4" stroke-dasharray="2,2" />

    <!-- Outer Perimeter Guide -->
    <rect x="0" y="0" width="500" height="700" rx="8" ry="8" stroke-width="1.0" />
  </g>
</svg>
